# ---------------------------------------------------------------------------
# DuckDB settings, and the standalone (Track A) engine sweeps.
#
# Two different things live here, deliberately kept apart:
#   runtime.*  — what the collector and compactor are configured with
#   sweeps.*   — parameter sweeps for the engine-only benchmark, which has no
#                DazzleDuck code in the path and is a CEILING, never a
#                statement about pipeline capacity
# ---------------------------------------------------------------------------

duckdb:
  # The Java driver pinned by the server's pom (duckdb.version).
  server_driver_version: 1.5.4.0
  # The CLI installed on the hosts. A mismatch invalidates any comparison
  # between a CLI-run engine test and the pipeline; check-versions.sh reports it.
  expected_cli_version: 1.5.4

  runtime:
    collector:
      threads: 2
      memory_limit: 2GB
      temp_directory: /var/tmp/duckdb-collector
    compactor:
      threads: 2
      memory_limit: 2GB
      temp_directory: /var/tmp/duckdb-compactor

  extensions:
    - httpfs
    - aws
    - ducklake
    - postgres
    - arrow      # community; collector only

  ducklake:
    # Required. Without it DuckLake keeps small commits as rows inlined in the
    # PostgreSQL catalog instead of Parquet on S3, and the compactor has
    # nothing to merge.
    data_inlining_row_limit: 0

# ---------------------------------------------------------------------------
# Track A sweeps. Sized for a t3.large with ~5 GiB of free local disk — see
# TEST_PLAN.md for what that rules out and why those rows read NOT TESTED.
# ---------------------------------------------------------------------------
sweeps:
  threads: [1, 2]                       # capped at logical cores (2)
  memory_limits: ["1GB", "2GB", "4GB"]
  row_group_sizes: [32000, 128000, 512000, 1000000]
  compressions: [snappy, zstd, uncompressed]
  zstd_level: 3

  datasets:
    seed: 42
    # Row counts that fit in local disk. The spec's 100M/500M rows and the
    # 100 GB / 1 TB compaction tiers do not fit on an 8 GB root volume.
    rows: [1000000, 10000000]
    layouts:
      - { name: "1x1GB",     files: 1,    target_file_mb: 1024 }
      - { name: "10x100MB",  files: 10,   target_file_mb: 100 }
      - { name: "100x10MB",  files: 100,  target_file_mb: 10 }
      - { name: "1000x1MB",  files: 1000, target_file_mb: 1 }

  protocol:
    warmup_runs: 1
    measured_runs: 5
    # Dropping the page cache needs root and must be verified by watching disk
    # read bytes actually rise. If it cannot be verified the run is labelled
    # warm-unknown, never cold.
    cold_cache: true
