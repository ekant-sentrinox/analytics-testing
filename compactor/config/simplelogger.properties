# ---------------------------------------------------------------------------
# slf4j-simple configuration for the DuckLake compactor.
#
# WHY THIS FILE AND NOT logback.xml:
# dazzleduck-sql-ducklake-compactor's dependency tree contains slf4j-simple and
# no logback-classic, so a logback.xml on the classpath is silently ignored.
# slf4j-simple reads simplelogger.properties from the classpath instead, and
# conf/ is first on the classpath, so this wins.
#
# WHY IT MATTERS:
# The compactor publishes its Micrometer meters through a LoggingMeterRegistry,
# so merge durations, file counts and housekeeping timings exist ONLY as log
# lines. slf4j-simple's default output has no timestamp at all, which turns
# those measurements into a bag of numbers with no time axis — unusable as a
# time series. Turning on showDateTime is what makes bench/parse_compactor_log.py
# able to produce a real compaction timeline.
#
# Times are UTC so they line up with the generator samples and the host agents.
# ---------------------------------------------------------------------------

org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.io.grpc=warn
org.slf4j.simpleLogger.log.io.netty=warn
org.slf4j.simpleLogger.log.org.apache.arrow=warn
org.slf4j.simpleLogger.log.io.dazzleduck=info
org.slf4j.simpleLogger.log.io.micrometer=info
